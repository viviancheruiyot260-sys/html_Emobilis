<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1>List</h1>
    <h2> ordered list</h2>
    <h2> list of countries</h2>
    <ol>
        <li>kenya</li>
        <li>Uganda</li>
        <li>Tanzania</li>
        <li>Rwanda</li>
    </ol>
     <h1> unordered list</h1>
    <h2> fruits</h2>
    <ul>
        <li>banana</li>
        <li>apple</li>
        <li>orange</li>
        <li>grape</li>
        <li>mango</li>
    </ul>
     <h1> descriptive list</h1>
   
    <dl>
        <dt>Banana</dt>
        <dd>Yellow fruit</dd>
        <dt>apple</dt>
        <dd>Red fruit</dd>
        <dt>orange</dt>
        <dd>Orange fruit</dd>
        <dt>grape</dt>
        <dd>Small fruit</dd>
        <dt>mango</dt>
        <dd>Sweet fruit</dd>
    </dl>
</body>
</html>
